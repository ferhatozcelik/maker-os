# Kurulum/giris ekrani yok: pardus kullanicisi dogrudan masaustune girer.
[Seat:*]
autologin-user=pardus
autologin-user-timeout=0
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter
# Ekran koruyucu/DPMS kapali: ekransiz kullanimda VNC'de kara ekran olmasin.
xserver-command=X -s 0 -dpms -nolisten tcp
