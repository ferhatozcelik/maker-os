[workspace]
resolver = "3"
members = ["crates/makerd-core", "crates/makerd", "crates/makerd-priv", "crates/makerd-user"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
makerd-core = { path = "crates/makerd-core" }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util", "process", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
libc = "0.2.180"
sha2 = { version = "0.11", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "json"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

# Hızlı yinelemeli derleme (Docker, -j2): bağımlılıklar optimize, kod debug.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 1
