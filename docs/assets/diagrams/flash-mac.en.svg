<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Terminal — macOS / Linux"><rect x="0.5" y="0.5" width="899" height="289" rx="12" fill="#1e1f24" stroke="#00000033"/><path d="M0.5 12.5 a12 12 0 0 1 12 -12 h875 a12 12 0 0 1 12 12 v22 h-899 z" fill="#2c2d33"/><circle cx="20" cy="17.0" r="6" fill="#ff5f57"/><circle cx="40" cy="17.0" r="6" fill="#febc2e"/><circle cx="60" cy="17.0" r="6" fill="#28c840"/><text x="450.0" y="22.0" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#a9abb3" text-anchor="middle">Terminal — macOS / Linux</text><text x="18" y="60" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#e6e6e9"><tspan fill="#f07a1a" font-weight="700">$ </tspan>sh -c &quot;$(curl -fsSL https://raw.githubusercontent.com/ferhatozcelik/maker-os/main/flash.sh)&quot;</text><text x="18" y="82" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f07a1a" xml:space="preserve">  MakerOS — microSD flasher</text><text x="18" y="104" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6e6e9" xml:space="preserve">==&gt; Downloading and verifying image (SHA-256) … Verified.</text><text x="18" y="126" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6e6e9" xml:space="preserve">==&gt; Looking for external disks</text><text x="18" y="148" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6e6e9" xml:space="preserve">  1) /dev/disk4       31.9 GB  SD Card Reader</text><text x="18" y="170" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f87171" xml:space="preserve">WARNING: EVERYTHING on /dev/disk4 will be erased.</text><text x="18" y="192" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#fbbf24" xml:space="preserve">Type the disk name to confirm (disk4): disk4</text><text x="18" y="214" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#fbbf24" xml:space="preserve">Wi-Fi network name (optional): HomeWiFi</text><text x="18" y="236" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9ca3af" xml:space="preserve">5.9 GB written · 32 MB/s</text><text x="18" y="258" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#4ade80" xml:space="preserve">✓ Done! Remove the card, insert it into the board and power it on.</text></svg>
