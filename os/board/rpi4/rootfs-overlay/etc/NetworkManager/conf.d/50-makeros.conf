[main]
dns=systemd-resolved
plugins=keyfile
firewall-backend=nftables

[connection]
# brcmfmac guc tasarrufu Pi'de gecikme ve kopmalara yol aciyor.
wifi.powersave=2
connection.mdns=2

[device]
wifi.scan-rand-mac-address=no

[keyfile]
# /etc /data uzerindeki overlay oldugu icin profiller kalicidir.
path=/etc/NetworkManager/system-connections
