# MakerOS RAUC yapilandirmasi: imzali paketler (makeros-<surum>-rpi4.raucb, GitHub Releases).
# Slot gruplari: boot.N (FAT, config.txt/kernel/DTB) + rootfs.N (EROFS, ham).
# Onyukleyici: Pi firmware tryboot + autoboot.txt, ozel arka uc betigi.
[system]
compatible=makeros-rpi4
bootloader=custom
data-directory=/data/rauc
# Kok FS salt-okunur (EROFS): paket ve slotlar /run altinda baglanir.
mountprefix=/run/rauc
bundle-formats=-plain
max-bundle-download-size=2147483648

[handlers]
bootloader-custom-backend=/usr/lib/rauc/rpi-tryboot-backend

[keyring]
# Acik imza sertifikasi (MakerOS release signing). Ozel anahtar depoda DEGIL: yayinlayanin
# bilgisayarinda ve GitHub Actions sirri MAKEROS_RAUC_KEY olarak durur.
path=/etc/rauc/keyring.pem
use-bundle-signing-time=true

[streaming]
send-headers=boot-id;machine-id;system-version

[slot.rootfs.0]
device=/dev/disk/by-partuuid/4d4f5332-05
type=raw
bootname=A

[slot.boot.0]
device=/dev/disk/by-partuuid/4d4f5332-02
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partuuid/4d4f5332-06
type=raw
bootname=B

[slot.boot.1]
device=/dev/disk/by-partuuid/4d4f5332-03
type=vfat
parent=rootfs.1
