# MakerOS: Bluetooth kulaklik/hoparlor bagliyken makerd varsayilan ses cikisini ona yonlendirir
# (/run/makeros-audio/asound.conf, bluez-alsa). Dosya yoksa kartin kendi cikisi (HDMI/3,5 mm) kullanilir.
# Kullanici programlari (makerd-user oturumu) ise $XDG_RUNTIME_DIR/makeros-asound.conf ile kullanicinin
# PulseAudio sunucusuna gider: ses tarayicinin hoparlorunden calar, mikrofon tarayicidan gelir.
@hooks [
	{
		func load
		files [
			"/run/makeros-audio/asound.conf"
			{
				@func concat
				strings [
					{ @func getenv vars [ XDG_RUNTIME_DIR ] default "/nonexistent" }
					"/makeros-asound.conf"
				]
			}
		]
		errors false
	}
]
