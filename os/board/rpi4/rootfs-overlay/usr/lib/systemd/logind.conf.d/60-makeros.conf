[Login]
NAutoVTs=2
ReserveVT=0
HandlePowerKey=poweroff
# Ekran oturumu (makeros-kiosk, hizmet hesabi "makerd") PAM ile session-N.scope'a tasinir; servis yeniden
# basladiginda eski labwc/cog orada sahipsiz kalip bir cekirdegi %100 kullaniyordu. Oturum bitince
# yalniz "makerd" hesabinin oturum surecleri oldurulur; diger hesaplar etkilenmez.
KillUserProcesses=yes
KillOnlyUsers=makerd
