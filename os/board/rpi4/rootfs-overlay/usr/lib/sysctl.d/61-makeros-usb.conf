# USB-C ag karti (usb0) ve "MakerOS" kurulum agi (wlan0) ayni 10.42.0.0/24 agini kullanir.
# Kablosu takili olmayan arayuzun yolu kullanilmasin: USB takili degilken kurulum agindaki
# telefonun yanitlari usb0'a gitmesin (varsayilan 0'da "linkdown" yollar da secilir).
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
