# MakerOS bellek/ag/sertlestirme ayarlari (docs/v2/research/03 §9.1)
# --- bellek / zram ---
vm.swappiness = 180
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# SD dostu geri yazma (bayt; 4 GB RAM)
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000
vm.min_free_kbytes = 32768
# --- sertlestirme ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
-kernel.unprivileged_userns_clone = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# --- ag (Wi-Fi + cok sayida WS baglantisi) ---
net.core.default_qdisc = fq_codel
net.ipv4.tcp_fastopen = 3
# code-server / dosya izleyiciler
fs.inotify.max_user_watches = 524288
# rootless podman: 80/443 disinda dusuk portlar makerd'de kalir
net.ipv4.ip_unprivileged_port_start = 1024
