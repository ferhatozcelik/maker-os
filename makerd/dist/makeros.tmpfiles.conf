# /usr/lib/tmpfiles.d/makeros.conf — makerd belirteci, makerd-priv soketi ve
# makerd-user@ soketleri. /run/makeros 0751: kullanıcılar listeleyemez ama
# user/ alt dizinine geçebilir (belirteç 0640, priv.sock 0660 root:maker kalır).
d /run/makeros 0751 maker maker -
# Yapışkan bit + herkese yazma (listeleme yok): her makerd-user kendi <uid>.sock'unu
# açar; başkasının soketini silemez. makerd bağlanırken soketin sahibini SO_PEERCRED ile denetler.
d /run/makeros/user 1733 root root -
d /run/user 1777 root root -
