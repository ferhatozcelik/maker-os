# Bağımlılıkları güncel tutar: her hafta güncelleme PR'ı açılır (GitHub Actions, Rust/Cargo, Python, Docker).
# Buildroot paketlerinin sürümleri os/configs ve os/package altında elle güncellenir.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /makerd
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }

  - package-ecosystem: pip
    directories:
      - /makerd/assets/plugins/defaults/khs
      - /makerd/assets/plugins/template
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories:
      - /os/docker
    schedule: { interval: weekly }
