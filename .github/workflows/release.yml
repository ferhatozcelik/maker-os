# MakerOS 2: test + Raspberry Pi imaji + imzali guncelleme paketi + GitHub Release.
#
# main'e her push'ta os/VERSION'daki surum henuz yayinlanmamissa:
#   imaj (makeros-<surum>-rpi4.img.xz) ve RAUC paketi (makeros-<surum>-rpi4.raucb) derlenir,
#   v<surum> etiketli Release olusturulur. Cihazlar paketi Ayarlar > Genel > Yazilim guncelleme ile kurar.
# Surum zaten yayindaysa yalnizca testler calisir (yeni surum icin os/VERSION'i artirin).
#
# Gerekli sir (Settings > Secrets and variables > Actions):
#   MAKEROS_RAUC_KEY  imza anahtari (PEM; rauc-key.pem dosyasinin tamami). Acik sertifikasi depoda:
#                     os/board/rpi4/rootfs-overlay/etc/rauc/keyring.pem. Sir yoksa surum YAYINLANMAZ
#                     (imzasiz paketi cihazlar kurmaz).
#
# Sure: ilk derleme (arac zinciri, WPE WebKit, Mesa, cekirdek) GitHub'in 6 saatlik is sinirina
# yaklasabilir. dl/ ve ccache basarisiz iste de onbellege yazilir; zaman asiminda "Re-run" ile
# ikinci deneme onceden derlenenleri onbellekten alir ve cok daha kisa surer.
name: MakerOS 2 surum

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: makeros-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: makerd testleri (Docker)
        run: make -C makerd test

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      BR_DIR: ${{ github.workspace }}/../br
    steps:
      - uses: actions/checkout@v4

      - name: Surum
        id: v
        run: |
          VERSION="$(tr -d ' \r\n' < os/VERSION)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::os/VERSION gecersiz: $VERSION"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release=0" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION zaten yayinda; derleme atlandi. Yeni surum icin os/VERSION'i artirin."
          else
            echo "release=1" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Imza anahtari
        if: steps.v.outputs.release == '1'
        env:
          KEY: ${{ secrets.MAKEROS_RAUC_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::MAKEROS_RAUC_KEY sirri yok: imzali guncelleme paketi uretilemez, surum yayinlanmadi."
            exit 1
          fi
          mkdir -p os/keys
          printf '%s\n' "$KEY" > os/keys/rauc-key.pem
          # Derleyici kap 'builder' (uid 1000) olarak okur; is makinesi tek kullanimliktir.
          chmod 644 os/keys/rauc-key.pem
          openssl pkey -in os/keys/rauc-key.pem -noout
          # Anahtar depodaki acik sertifikayla eslesmeli (yoksa cihazlar paketi reddeder).
          a=$(openssl pkey -in os/keys/rauc-key.pem -pubout | sha256sum)
          b=$(openssl x509 -in os/board/rpi4/rootfs-overlay/etc/rauc/keyring.pem -pubkey -noout | sha256sum)
          [ "$a" = "$b" ] || { echo "::error::MAKEROS_RAUC_KEY, keyring.pem ile eslesmiyor"; exit 1; }

      - name: Disk alani
        if: steps.v.outputs.release == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          docker system prune -af >/dev/null || true
          df -h /

      - name: Onbellek (indirmeler + ccache) geri yukle
        if: steps.v.outputs.release == '1'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BR_DIR }}/dl
            ${{ env.BR_DIR }}/ccache
          key: br-${{ hashFiles('os/configs/*', 'os/build.sh') }}-${{ github.run_id }}
          restore-keys: |
            br-${{ hashFiles('os/configs/*', 'os/build.sh') }}-
            br-

      - name: Chromium paketi (Debian trixie arm64)
        if: steps.v.outputs.release == '1'
        run: |
          mkdir -p os/out
          docker run --rm -v "$PWD/os/chromium":/s:ro -v "$PWD/os/out":/out debian:trixie sh /s/build-bundle.sh
          ls -la os/out

      - name: Imaj ve guncelleme paketi (Buildroot)
        if: steps.v.outputs.release == '1'
        env:
          MAKEROS_VOLUME: ${{ env.BR_DIR }}
          MAKEROS_HEAVY_JOBS: "2"
        run: |
          mkdir -p "$BR_DIR" && chmod 777 "$BR_DIR"
          sudo chmod -R a+rwX "$BR_DIR" || true
          ./os/build.sh build
          ls -la os/out
          test -f "os/out/makeros-${{ steps.v.outputs.version }}-rpi4.img.xz"
          test -f "os/out/makeros-${{ steps.v.outputs.version }}-rpi4.raucb"

      - name: Onbellegi kaydet (basarisiz iste de)
        if: always() && steps.v.outputs.release == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BR_DIR }}/dl
            ${{ env.BR_DIR }}/ccache
          key: br-${{ hashFiles('os/configs/*', 'os/build.sh') }}-${{ github.run_id }}

      - name: Anahtari sil
        if: always()
        run: rm -f os/keys/rauc-key.pem

      - name: Surum notlari
        if: steps.v.outputs.release == '1'
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MakerOS $V" > notes.md
          cat >> notes.md <<EOF

          ---
          **Kurulum:** \`makeros-$V-rpi4.img.xz\` dosyasini Raspberry Pi Imager ile SD karta yazin (Raspberry Pi 4/400).
          **Guncelleme:** MakerOS 2 cihazlari Ayarlar › Genel › Yazilim guncelleme ile kurar (\`.raucb\`, imzali).
          MakerOS 1.x (Pardus tabanli) cihazlar uzaktan guncellenemez; SD kart yeniden yazilmalidir.
          EOF

      - name: Release
        if: steps.v.outputs.release == '1'
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" \
            "os/out/makeros-$V-rpi4.img.xz" "os/out/makeros-$V-rpi4.img.xz.sha256" \
            "os/out/makeros-$V-rpi4.raucb" "os/out/makeros-$V-rpi4.raucb.sha256" \
            --title "MakerOS $V" --notes-file notes.md --target "$GITHUB_SHA"
