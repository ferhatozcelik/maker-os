# MakerOS Bench sonuç listesi: benchmark/results/ değişince doğrular; main'de README tablosu ve grafikleri
# (benchmark/README.md) yeniden üretilip kaydedilir. Etkileşimli sayfa pages.yml ile yayımlanır.
name: Benchmark sonuçları

on:
  push:
    branches: [main]
    paths: ["benchmark/results/**", "benchmark/tools/render.py", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["benchmark/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Doğrula
        run: |
          python3 benchmark/tools/render.py --check
          python3 -m py_compile benchmark/makeros-bench.py
      - name: README'yi üret ve kaydet
        if: github.event_name != 'pull_request'
        run: |
          python3 benchmark/tools/render.py
          if [ -n "$(git status --porcelain -- benchmark/README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add benchmark/README.md
            git commit -m "benchmark: sonuç listesi ve grafikler güncellendi"
            git push
          fi
