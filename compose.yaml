# MakerOS 2 yerel önizleme: `docker compose up` → http://localhost/
# (os/run-docker.sh de 80 portunu kullanır; ikisi aynı anda çalışmaz.)
# makerd sahte veri (mock) modunda çalışır; giriş: maker / maker.
# "desktop": MakerOS'un labwc + wayvnc yığını (monitörsüz, GPU'suz); Uzak Ekran
# uygulaması makerd /api/v1/vnc üzerinden ona bağlanır. wayvnc dışarı açılmaz.
services:
  makerd:
    build:
      context: ./makerd
      dockerfile: Dockerfile
    image: makeros/makerd:dev
    command: ["--mock", "--listen", ":8080", "--web", "/web", "--log-level", "info", "--vnc", "desktop:5900"]
    ports:
      - "80:8080"
    volumes:
      - ./shell:/web:ro
    read_only: true
    tmpfs:
      - /tmp
      - /home/maker:uid=1000,gid=1000,mode=0755
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  desktop:
    build:
      context: .
      dockerfile: bench/desktop/Dockerfile
    image: makeros/desktop:dev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
