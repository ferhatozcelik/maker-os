<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera</title>
<link rel="icon" type="image/svg+xml" href="/shell/icons/logo.svg">
<link rel="stylesheet" href="/shell/css/tokens.css">
<link rel="stylesheet" href="/shell/css/kit.css">
<link rel="stylesheet" href="/shell/css/app.css">
<style>
body { background: #111114; color: #eee; }
.view { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; background: #000; }
.view img { max-width: 100%; max-height: 100%; display: block; }
.view .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: #bbb; }
.bar2 { background: #1d1d21; color: #eee; }
.bar2 .btn { background: #303036; color: #f2f2f6; border-color: transparent; }
.bar2 .btn.primary { background: var(--accent); }
.info { font-size: var(--fs-footnote); color: #aaa; }
.shot { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 62px; height: 62px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.25); }
.shot:active { background: #fff; }
.flash { animation: fl .35s; } @keyframes fl { from { filter: brightness(3); } }
</style>
</head>
<body>
<div class="bar2"><span class="info"></span><span class="grow"></span><button class="btn sm b-gal"></button><button class="btn sm b-pause"></button></div>
<div class="view"><img alt=""><div class="msg" hidden></div><button class="shot" aria-label="Fotoğraf"></button></div>
<script type="module" src="/shell/apps/camera/camera.js"></script>
</body>
</html>
