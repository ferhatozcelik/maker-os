<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eklentiler</title>
<link rel="icon" type="image/svg+xml" href="/shell/icons/logo.svg">
<link rel="stylesheet" href="/shell/css/tokens.css">
<link rel="stylesheet" href="/shell/css/kit.css">
<link rel="stylesheet" href="/shell/css/app.css">
<style>
.pl .ico{background:linear-gradient(135deg,#ff9f43,#e8590c)}.pl.run .ico{background:linear-gradient(135deg,#2fbf71,#127a52)}.pl .ico img{width:22px;height:22px}
.pl.st .ico{background:var(--bg-hover)}.pl.st .ico img{width:28px;height:28px;border-radius:6px}
.pl .tags{display:flex;flex-wrap:wrap;gap:4px}
.pl .tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:var(--fs-caption);color:var(--text-2);background:var(--bg-hover)}
.pl .state{color:var(--accent);font-weight:500}
.pl .btn span{display:inline-flex;margin-right:4px;vertical-align:-2px}
.spin svg{animation:pl-spin 1s linear infinite}@keyframes pl-spin{to{transform:rotate(360deg)}}
body[data-tab=store] .b-tpl,body[data-tab=store] .b-imp{display:none}
</style>
</head>
<body>
<div class="bar2"><h1 class="h"></h1><span class="tabs"></span><span class="grow"></span><button class="btn sm b-re"></button><a class="btn sm b-tpl" href="/api/v1/plugins/template.zip"></a><label class="btn sm primary b-imp"><input type="file" accept=".zip,application/zip" hidden></label></div>
<div class="wrap"><p class="note n-top"></p><div class="cards"></div></div>
<script type="module" src="/shell/apps/plugins/plugins.js"></script>
</body>
</html>
