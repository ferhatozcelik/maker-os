<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Asistan</title>
<link rel="stylesheet" href="/shell/css/tokens.css">
<!-- Masaüstü widget'ı: yerel MakerOS AI asistanı (MakerOS ve genel konularda sohbet eder, uygulama açar, ajan başlatır, komut çalıştırır). -->
<style>
html, body { margin: 0; background: transparent; }
body { font: 13px/1.45 var(--font-sans, system-ui, sans-serif); color: var(--text); }
.card { margin: 2px; border-radius: 18px; background: var(--bg-content, #fff);
  border: .5px solid color-mix(in srgb, var(--text) 14%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; }
.hd { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 12px; }
.logo { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff9a3d, #ff5a1a); flex: none; }
.hd b { font-size: 13px; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-2); }
.st.ok i { background: #3fc35a; } .st.load i { background: #f5b83d; animation: bl 1s infinite; } .st.off i { background: #f2555a; }
@keyframes bl { 50% { opacity: .3; } }
.grow { flex: 1; }
.ib { width: 24px; height: 24px; border: 0; border-radius: 7px; background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ib:hover { background: var(--bg-hover); color: var(--text); }
.clr { height: 24px; padding: 0 8px; border: 0; border-radius: 7px; background: var(--bg-hover); color: var(--text-2); font: inherit; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.clr:hover { background: color-mix(in srgb, #e0393f 15%, var(--bg-hover)); color: #e0393f; }
form { display: flex; gap: 6px; padding: 4px 10px 8px; }
input { flex: 1; min-width: 0; height: 32px; padding: 0 11px; border-radius: 10px; border: .5px solid var(--border, rgba(0,0,0,.15)); background: var(--bg, #fff); color: var(--text); font: inherit; outline: none; }
input:focus { border-color: var(--accent, #ff7a1a); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #ff7a1a) 22%, transparent); }
.go { width: 32px; height: 32px; border: 0; border-radius: 10px; background: var(--accent, #ff7a1a); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; transition: background .15s; }
.go.stop { background: #e0393f; }
.go:disabled { opacity: .45; cursor: default; }
.prog-wrap { display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; }
.prog-wrap[hidden] { display: none; }
.prog-bar { flex: 1; height: 4px; border-radius: 999px; background: var(--bg-hover, rgba(128,128,128,.2)); overflow: hidden; position: relative; }
.prog-bar i { display: block; position: absolute; top: 0; bottom: 0; width: 42%; border-radius: 999px; background: linear-gradient(90deg, #ff9a3d, #ff5a1a); animation: indet 1.15s ease-in-out infinite; }
@keyframes indet { 0% { left: -42%; } 100% { left: 100%; } }
.prog-stop { border: 0; border-radius: 6px; padding: 2px 8px; background: color-mix(in srgb, #e0393f 16%, transparent); color: #e0393f; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.prog-stop:hover { background: #e0393f; color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 10px; }
.chips button { border: 0; border-radius: 999px; padding: 4px 9px; background: var(--bg-hover); color: var(--text); font: inherit; font-size: 11.5px; cursor: pointer; }
.chips button:hover { background: var(--bg-active); }
.out { max-height: 300px; overflow: auto; padding: 0 12px 10px; border-top: .5px solid var(--separator); }
.out[hidden], .chips[hidden] { display: none; }
.q { margin: 10px 0 6px; font-weight: 600; }
.a { white-space: normal; word-wrap: break-word; }
.a p { margin: 0 0 6px; }
.a code { font: 11.5px ui-monospace, "JetBrains Mono", monospace; background: var(--bg-hover); padding: 1px 4px; border-radius: 4px; }
.a pre { margin: 4px 0 8px; padding: 7px 9px; border-radius: 8px; background: #1b1b1f; color: #e6e6ea; overflow-x: auto; }
.a pre code { background: none; padding: 0; color: inherit; }
.cur::after { content: "▍"; animation: bl 1s infinite; color: var(--accent, #ff7a1a); }
.cmds { display: flex; flex-direction: column; gap: 5px; margin: 8px 0 2px; }
.cmd { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; padding: 6px 7px; border-radius: 9px; background: var(--bg-hover); }
.cmd code { font: 11.5px ui-monospace, "JetBrains Mono", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk { font-size: 9.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 6px; border-radius: 5px; color: #fff; }
.rk.SAFE { background: #2fa84f; } .rk.WARNING { background: #d99a12; } .rk.DANGEROUS { background: #e0393f; } .rk.ACTION { background: var(--accent, #ff7a1a); }
.why { grid-column: 1 / 4; font-size: 11px; color: var(--text-2); margin-top: -2px; }
.note { font-size: 10.5px; color: var(--text-2); margin-top: 6px; }
.err { color: #e0393f; margin: 8px 0; }
.ft { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-2); padding: 6px 12px 9px; }
.ft select { border: 0; background: var(--bg-hover); color: var(--text); font: inherit; font-size: 10.5px; border-radius: 6px; padding: 2px 6px; cursor: pointer; }
.cmd .run { width: auto; padding: 0 7px; gap: 3px; display: inline-flex; align-items: center; font: inherit; font-size: 11px; color: var(--accent, #ff7a1a); }
.cmd .acts { display: flex; gap: 2px; }
.conf { grid-column: 1 / 4; display: flex; flex-direction: column; gap: 6px; padding: 6px 2px 2px; font-size: 11.5px; }
.conf .row { display: flex; gap: 6px; align-items: center; }
.conf input { height: 26px; font: 11.5px ui-monospace, monospace; }
.conf button { border: 0; border-radius: 7px; padding: 4px 10px; font: inherit; cursor: pointer; background: var(--bg-active); color: var(--text); }
.conf button.ok { background: var(--accent, #ff7a1a); color: #fff; } .conf button.ok.danger { background: #e0393f; }
.conf button:disabled { opacity: .45; cursor: default; }
.res { grid-column: 1 / 4; margin-top: 2px; }
.res pre { margin: 0; max-height: 160px; overflow: auto; padding: 7px 9px; border-radius: 8px; background: #1b1b1f; color: #e6e6ea; font: 11px/1.35 ui-monospace, "JetBrains Mono", monospace; white-space: pre-wrap; word-break: break-word; }
.res .rh { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--text-2); margin-bottom: 3px; }
.res .rh b.ok { color: #2fa84f; } .res .rh b.bad { color: #e0393f; }
.res .rh button { margin-left: auto; border: 0; background: none; color: var(--accent, #ff7a1a); font: inherit; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <span class="logo"></span><b>AI Asistan</b><span class="st" id="st"><i></i><span>…</span></span><span class="grow"></span>
    <button type="button" class="clr" id="new" title="Sohbet geçmişini ve bağlamı temizle"></button>
    <button type="button" class="ib" id="close" title="Widget'ı gizle (Ayarlar › Görünüm'den geri açılır)"></button>
  </div>
  <form id="f"><input id="in" autocomplete="off" spellcheck="false" placeholder="Ne yapmak istersiniz? (Sohbet, MakerOS, komut…)"><button class="go" id="go" title="Gönder"></button></form>
  <div class="prog-wrap" id="prog" hidden><div class="prog-bar"><i></i></div><button type="button" class="prog-stop" id="stop">Durdur</button></div>
  <div class="chips" id="chips"></div>
  <div class="out" id="out" hidden></div>
  <div class="ft"><span id="meta">MakerOS AI</span><select id="mode" title="İzin modu: Full Bypass komutları ve eylemleri doğrudan çalıştırır; İzin iste çalıştırmadan önce onay alır."><option value="bypass">Full Bypass</option><option value="sor">İzin iste</option></select></div>
</div>
<script type="module" src="/shell/apps/ai-widget/widget.js"></script>
</body>
</html>
