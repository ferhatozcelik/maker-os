<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosyalar</title>
<link rel="icon" type="image/svg+xml" href="/shell/icons/logo.svg">
<link rel="stylesheet" href="/shell/css/tokens.css">
<link rel="stylesheet" href="/shell/css/kit.css">
<link rel="stylesheet" href="/shell/css/app.css">
<style>
body { display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
.fm { flex: 1; min-height: 0; display: grid; grid-template-columns: 196px 1fr; }
/* kenar çubuğu */
/* pencere düğmeleri (trafik ışıkları) kenar çubuğunun üst köşesinde: içerik onların altından başlar */
.side { overflow: auto; padding: calc(var(--tb) + 4px) 8px 10px; border-right: .5px solid var(--separator); background: var(--bg-sidebar, var(--bg-hover)); }
.side h4 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.side h4:first-child { margin-top: 0; }
.side button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 7px; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.side button .ic { color: var(--accent); flex: none; }
.side button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side button:hover { background: var(--bg-active); }
.side button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 600; }
.side button.dropok { outline: 2px solid var(--accent); outline-offset: -2px; }
/* ana alan */
.main { min-width: 0; display: flex; flex-direction: column; }
.tb { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: .5px solid var(--separator); }
.tb .ib { width: 30px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: none; color: var(--text); cursor: pointer; flex: none; }
.tb .ib:hover:not(:disabled) { background: var(--bg-hover); }
.tb .ib:disabled { opacity: .35; cursor: default; }
.tb .ib.on { background: var(--bg-active); }
.crumbs { display: flex; align-items: center; gap: 1px; min-width: 60px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--text-2); white-space: nowrap; font: inherit; font-weight: 500; cursor: pointer; }
.crumbs button:last-child { color: var(--text); font-weight: 600; }
.crumbs button:hover { background: var(--bg-hover); }
.crumbs .sep { color: var(--text-3, var(--text-2)); opacity: .6; }
.q { flex: 0 1 180px; width: 180px; min-width: 90px; height: 28px; padding: 0 10px; border-radius: 8px; border: .5px solid var(--border); background: var(--bg-content); color: var(--text); font: inherit; }
.seg2 { display: flex; border-radius: 8px; background: var(--bg-hover); padding: 2px; }
.seg2 .ib { width: 28px; height: 24px; }
.area { flex: 1; min-height: 0; overflow: auto; padding: 10px; outline: none; position: relative; }
.area.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
.empty { display: grid; place-items: center; height: 100%; color: var(--text-2); text-align: center; padding: 30px; }
/* ızgara */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; align-content: start; }
.grid .it { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; text-align: center; cursor: default; user-select: none; }
.grid .th { width: 64px; height: 56px; display: grid; place-items: center; }
.grid .th img { max-width: 64px; max-height: 56px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.2); object-fit: cover; }
.grid .nm { font-size: 12px; line-height: 1.25; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; padding: 1px 4px; border-radius: 4px; }
.grid .it.sel .th { background: var(--bg-active); border-radius: 8px; }
.grid .it.sel .nm { background: var(--accent); color: var(--on-accent, #fff); }
/* liste */
.list .hd, .list .it { display: grid; grid-template-columns: 24px 1fr 90px 150px; align-items: center; gap: 8px; padding: 4px 10px; min-height: 30px; user-select: none; }
.list .hd { position: sticky; top: -10px; background: var(--bg); font-size: 11px; color: var(--text-2); border-bottom: .5px solid var(--separator); z-index: 1; }
.list .hd button { border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; }
.list .hd button.r { text-align: right; }
.list .it { border-radius: 6px; }
.list .it:nth-child(odd of .it) { background: color-mix(in srgb, var(--bg-hover) 50%, transparent); }
.list .it .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .it .sz, .list .it .tm { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.list .it.sel { background: var(--accent) !important; color: var(--on-accent, #fff); }
.list .it.sel .sz, .list .it.sel .tm, .list .it.sel .ic { color: inherit !important; }
.it.cut { opacity: .45; }
.it.dropok { outline: 2px solid var(--accent); outline-offset: -2px; }
.ic.dir { color: var(--accent); }
.ic.img { color: #0ea5e9; } .ic.vid { color: #a855f7; } .ic.aud { color: #ec4899; } .ic.code { color: #22c55e; } .ic.arc { color: #f59e0b; }
.status { padding: 4px 12px; font-size: 11px; color: var(--text-2); border-top: .5px solid var(--separator); display: flex; gap: 12px; white-space: nowrap; overflow: hidden; }
.status .prog { margin-left: auto; color: var(--accent); }
/* menü */
.menu2 { position: fixed; z-index: 40; background: var(--bg-elevated); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); border: .5px solid var(--border); padding: 4px; min-width: 190px; }
.menu2 button { display: flex; width: 100%; gap: 8px; align-items: center; border: 0; background: none; padding: 5px 10px; border-radius: 6px; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
.menu2 button:hover:not(:disabled) { background: var(--accent); color: var(--on-accent, #fff); }
.menu2 button:disabled { opacity: .4; }
.menu2 kbd { margin-left: auto; font: 11px var(--font-mono); opacity: .6; }
.menu2 hr { border: 0; border-top: .5px solid var(--separator); margin: 4px 6px; }
/* hızlı bakış */
.ql { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 24px; }
.ql .box { max-width: min(1000px, 96vw); max-height: 92vh; display: flex; flex-direction: column; background: var(--bg-elevated); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.ql .hd { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: .5px solid var(--separator); font-weight: 600; }
.ql .hd span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ql .bd { overflow: auto; min-width: 320px; display: grid; place-items: center; background: #111; }
.ql img, .ql video { max-width: min(1000px, 96vw); max-height: calc(92vh - 50px); display: block; }
.ql iframe { width: min(1000px, 96vw); height: calc(92vh - 50px); border: 0; background: #fff; }
.ql pre { margin: 0; width: min(1000px, 96vw); max-height: calc(92vh - 50px); overflow: auto; padding: 14px; background: var(--bg-content); color: var(--text); font: 12px/1.5 var(--font-mono); user-select: text; white-space: pre-wrap; align-self: stretch; }
.ql audio { margin: 30px; }
.toggle-side { display: none !important; }
@media (max-width: 640px) {
  .fm { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 220px; transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.2); }
  body.side-open .side { transform: none; }
  .toggle-side { display: grid !important; }
  .side { padding-top: calc(var(--tb) + 4px); }
  /* kenar çubuğu gizli: trafik ışıkları araç çubuğunun solunda, düğmelerin üstüne binmesin */
  html[data-embed=window] .main .tb { padding-left: 76px; }
  .q { flex-basis: 110px; width: 110px; }
  .list .hd, .list .it { grid-template-columns: 24px 1fr 70px; }
  .list .tm { display: none; }
}
</style>
</head>
<body>
<div class="fm">
  <aside class="side"></aside>
  <section class="main">
    <div class="tb">
      <button class="ib toggle-side"></button>
      <button class="ib b-back"></button><button class="ib b-fwd"></button><button class="ib b-up"></button>
      <div class="crumbs"></div>
      <input class="q" type="search" autocomplete="off" spellcheck="false">
      <div class="seg2"><button class="ib v-grid"></button><button class="ib v-list"></button></div>
      <button class="ib b-mk"></button>
      <label class="ib b-up2"><input type="file" multiple hidden></label>
    </div>
    <div class="area" tabindex="0"></div>
    <div class="status"><span class="st-n"></span><span class="st-sel"></span><span class="prog"></span></div>
  </section>
</div>
<script type="module" src="/shell/apps/files/files.js"></script>
</body>
</html>
