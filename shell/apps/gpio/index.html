<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPIO</title>
<link rel="icon" type="image/svg+xml" href="/shell/icons/logo.svg">
<link rel="stylesheet" href="/shell/css/tokens.css">
<link rel="stylesheet" href="/shell/css/kit.css">
<link rel="stylesheet" href="/shell/css/app.css">
<style>
.board { display: grid; grid-template-columns: 1fr auto auto 1fr; gap: 4px 6px; align-items: center; max-width: 620px; margin: 0 auto; }
.lbl { font-size: var(--fs-footnote); display: flex; gap: 6px; align-items: center; min-width: 0; }
.lbl.l { justify-content: flex-end; text-align: right; }
.lbl .nm { font-weight: 600; } .lbl .alt { color: var(--text-2); font-size: var(--fs-caption); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin { width: 30px; height: 30px; border-radius: 50%; border: 0; font: 600 11px var(--font-mono); display: grid; place-items: center; color: #fff; background: #6b6f77; position: relative; }
.pin.p3v { background: #e8590c; } .pin.p5v { background: #d6336c; } .pin.gnd { background: #212529; }
.pin.gp { background: var(--bg-hover); color: var(--text); box-shadow: inset 0 0 0 2px var(--separator); cursor: pointer; }
.pin.gp.hi { background: #2fbf71; color: #fff; box-shadow: none; }
.pin.gp.out { box-shadow: inset 0 0 0 2px var(--accent); }
.pin.gp.used { opacity: .55; cursor: not-allowed; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 14px 0 0; font-size: var(--fs-footnote); color: var(--text-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
</style>
</head>
<body>
<div class="bar2"><h1 class="h"></h1><span class="badge b-model"></span><span class="grow"></span></div>
<div class="wrap"><div class="board"></div><div class="legend"></div><p class="note n-help" style="text-align:center"></p></div>
<script type="module" src="/shell/apps/gpio/gpio.js"></script>
</body>
</html>
